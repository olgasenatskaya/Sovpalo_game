<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Совпало!</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#20233b;background:#f5f3ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:520px;margin:auto;padding:22px 16px 70px}h1{font-size:38px;margin:12px 0 4px}h2{font-size:24px}.muted{color:#74748a}.panel{background:white;border:1px solid #e8e5f2;border-radius:22px;padding:22px;margin:18px 0;box-shadow:0 10px 30px #2720520c}input,button{font:inherit;border-radius:12px;padding:13px;border:1px solid #dcd9e8}input{width:100%;margin:7px 0 13px}button{cursor:pointer;background:#6555d8;color:white;border:0;font-weight:700}button:disabled{opacity:.45;cursor:default}.secondary{background:#edeafa;color:#4438a2}.wide{width:100%;margin-top:12px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.word{background:#f2efff;border-radius:12px;padding:14px 12px;flex:1;min-width:0;overflow-wrap:anywhere}.pick{flex:1;min-width:0;background:#fff;color:#4339a1;border:2px solid #d9d3fa;padding:12px 5px;overflow-wrap:anywhere;font-size:14px}.pick.selected{border-color:#6352e2;background:#e6e0ff}.pair{display:flex;gap:9px;align-items:stretch;margin:9px 0}.pair>*{width:50%}.score{background:#f1f9f2;padding:12px;border-radius:12px;margin:8px 0}.hidden{display:none}.tag{display:inline-block;background:#e8e4ff;color:#5140ae;border-radius:99px;padding:5px 11px;font-size:13px}.error{color:#ba3030}.small{font-size:13px}</style></head><body><main class="wrap"><h1>✨ Совпало!</h1><div class="muted">Угадай ассоциации ведущего</div><div id="entry" class="panel"><label>Ваше имя</label><input id="name" placeholder="Например, Маша" maxlength="24"><button class="wide" onclick="connect('create')">Создать комнату</button><p class="muted" style="text-align:center">или присоединиться</p><input id="codeInput" placeholder="Код комнаты" maxlength="6"><button class="wide secondary" onclick="connect('join')">Войти в комнату</button></div><div id="game" class="hidden"><div class="panel"><div class="row"><div><div class="muted small">КОМНАТА</div><h2 id="roomCode" style="margin:3px 0"></h2></div><button class="secondary" onclick="share()">Поделиться</button></div><div id="members"></div></div><div class="panel" id="stage"></div></div><p id="error" class="error"></p></main><script>
let ws,state,selected=null,mapping=[0,1,2,3,4],lastRound=-1,submitted=false;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search);if(params.has('room'))$('codeInput').value=params.get('room').toUpperCase();
function send(x){if(ws?.readyState===1)ws.send(JSON.stringify(x))}
function connect(action){let name=$('name').value.trim()||localStorage.getItem('sovpalo_name')||'Игрок',code=$('codeInput').value.trim().toUpperCase();localStorage.setItem('sovpalo_name',name);if(action==='join'&&!code){$('error').textContent='Введите код комнаты';return}if(ws)ws.close();ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onopen=()=>send({action,name,code,id:localStorage.getItem('sovpalo_'+code)});ws.onmessage=e=>{let d=JSON.parse(e.data);if(d.type==='error'){$('error').textContent=d.message;return}state=d;localStorage.setItem('sovpalo_'+d.code,d.you);history.replaceState(null,'','?room='+d.code);$('error').textContent='';render()};ws.onclose=()=>{if(state)$('error').textContent='Соединение потеряно. Обновите страницу для переподключения.'}}
function share(){let url=location.href;if(navigator.share)navigator.share({title:'Совпало!',url}).catch(()=>{});else navigator.clipboard?.writeText(url).then(()=>alert('Ссылка скопирована'))}
function choose(i){if(submitted||!state)return;if(selected===null){selected=i}else if(selected===i){selected=null}else{[mapping[selected],mapping[i]]=[mapping[i],mapping[selected]];selected=null}render()}
function submit(){submitted=true;send({action:'submit',mapping});render()}
function render(){if(!state)return;$('entry').classList.add('hidden');$('game').classList.remove('hidden');$('roomCode').textContent=state.code;$('members').innerHTML=state.players.map(p=>`<div class="row" style="padding:7px 0"><span>${esc(p.name)} ${p.id===state.host?'👑':''} ${p.id===state.you?'(вы)':''}</span><b>${p.score} очк.</b></div>`).join('');let s=$('stage');if(state.phase==='lobby'){s.innerHTML='<h2>Ждём игроков</h2><p>Отправьте ссылку друзьям. Нужно минимум два участника.</p>'+ (state.you===state.players[0].id?`<button class="wide" ${state.players.length<2?'disabled':''} onclick="send({action:'start'})">Начать игру</button>`:'<p class="muted">Создатель комнаты начнёт игру.</p>');return}if(state.round!==lastRound){lastRound=state.round;mapping=[0,1,2,3,4];selected=null;submitted=false}let isHost=state.you===state.host,hostName=state.players.find(p=>p.id===state.host)?.name||'Ведущий',hasSubmitted=state.submitted.includes(state.you);if(hasSubmitted)submitted=true;let title=isHost?'Вы ведущий':'Угадайте пары';let html=`<div class="row"><h2>${title}</h2><span class="tag">Раунд ${state.round}</span></div><p class="muted">${isHost?'Расположите прилагательные напротив существительных. Ваш выбор будет скрыт.':'Как, по-вашему, '+esc(hostName)+' расположил(а) прилагательные?'}</p>`;
if(state.phase==='host'&&!isHost){s.innerHTML=html+'<p>Ведущий составляет ассоциации. Подождите…</p>';return}
if(state.phase==='guess'&&isHost){s.innerHTML=html+'<p>Команда угадывает ваши ассоциации.</p><p>'+state.submitted.length+' из '+state.players.length+' ответили.</p>';return}
if(state.phase==='reveal'){let answer=state.revealed[state.host].mapping,mine=state.revealed[state.you]?.mapping;html+='<h3>Карточки вскрыты!</h3>'+state.nouns.map((n,i)=>`<div class="pair"><div class="word">${esc(n)}</div><div class="word">${esc(state.adjs[answer[i]])}${!isHost&&mine?' '+(mine[i]===answer[i]?'✅':'❌'):''}</div></div>`).join('');html+='<h3>Результаты</h3>'+state.players.filter(p=>p.id!==state.host).map(p=>`<div class="score">${esc(p.name)}: ${state.revealed[p.id]?.points??0} из 5</div>`).join('');if(isHost)html+='<button class="wide" onclick="send({action:\'next\'})">Следующий раунд →</button>';else html+='<p class="muted">Ждём, пока ведущий начнёт следующий раунд.</p>';s.innerHTML=html;return}
html+='<p class="muted small">Нажмите две карточки справа, чтобы поменять их местами.</p>'+state.nouns.map((n,i)=>`<div class="pair"><div class="word">${esc(n)}</div><button class="pick ${selected===i?'selected':''}" ${submitted?'disabled':''} onclick="choose(${i})">${esc(state.adjs[mapping[i]])}</button></div>`).join('');html+=submitted?'<p class="score">✓ Ответ отправлен. Ждём остальных игроков.</p>':'<button class="wide" onclick="submit()">Подтвердить пары</button>';s.innerHTML=html}
$('name').value=localStorage.getItem('sovpalo_name')||'';
</script></body></html>
